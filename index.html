<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다목적 단체 여행 관리 매니저</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        #map-timeline, #map-expected, #map-actual, #map-dashboard { height: 320px; border-radius: 0.5rem; z-index: 10; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- 헤더 -->
    <header class="bg-blue-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <button onclick="goTripSelector()" class="bg-blue-700 hover:bg-blue-800 px-2.5 py-1 rounded-lg text-xs font-bold transition">
                    <i class="fa-solid fa-list mr-1"></i> 여행 목록
                </button>
                <div>
                    <h1 id="header-trip-title" class="text-base font-bold flex items-center gap-1.5">여행 선택 필요</h1>
                    <p id="header-trip-subtitle" class="text-[11px] text-blue-100">원하는 여행을 선택하거나 새로 만드세요</p>
                </div>
            </div>
            <span id="sync-status" class="text-xs bg-amber-500 px-2.5 py-1 rounded-full text-white font-semibold">DB 연결중...</span>
        </div>
    </header>

    <!-- 에러 안내 배너 -->
    <div id="error-banner" class="hidden bg-red-600 text-white px-4 py-3 text-xs leading-relaxed shadow-inner">
        <div class="max-w-4xl mx-auto flex items-start gap-2">
            <i class="fa-solid fa-triangle-exclamation text-base mt-0.5"></i>
            <div id="error-message" class="flex-1"></div>
        </div>
    </div>

    <!-- 0. 여행 선택 및 생성 화면 -->
    <div id="trip-selector-screen" class="max-w-4xl mx-auto px-4 py-6 w-full space-y-6">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-800"><i class="fa-solid fa-plane-departure text-blue-600 mr-2"></i>내 여행 일정 목록</h2>
                <button onclick="fillDanyangPDFData()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-xl text-xs font-bold transition shadow-sm">
                    <i class="fa-solid fa-wand-magic-sparkles mr-1"></i> 단양·청풍호 계획서 자동생성
                </button>
            </div>
            <p class="text-xs text-slate-500">관리할 여행을 선택하거나, 아래에서 새로운 여행을 만들어 보세요.</p>
            <div id="trip-cards-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2"></div>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
            <h2 class="text-base font-bold text-slate-800"><i class="fa-solid fa-circle-plus text-emerald-600 mr-2"></i>새로운 여행 만들기</h2>
            <form id="new-trip-form" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <input type="text" id="new-trip-name" placeholder="여행 이름 (예: 강릉 바다 여행)" required class="border border-slate-300 rounded-xl px-3 py-2 text-sm">
                <input type="date" id="new-trip-start" required class="border border-slate-300 rounded-xl px-3 py-2 text-sm">
                <input type="date" id="new-trip-end" required class="border border-slate-300 rounded-xl px-3 py-2 text-sm">
                <button type="submit" class="sm:col-span-3 bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-xl font-bold text-sm transition">새 여행 생성하기</button>
            </form>
        </div>
    </div>

    <!-- 메인 컨테이너 -->
    <main id="main-app-screen" class="max-w-4xl mx-auto px-3 py-4 flex-grow w-full space-y-4 hidden">

        <!-- 탭 메뉴 -->
        <div class="flex border-b border-slate-200 bg-white rounded-t-xl shadow-sm overflow-x-auto no-scrollbar text-xs md:text-sm sticky top-[60px] z-40">
            <button onclick="switchTab('timeline')" id="btn-tab-timeline" class="flex-1 min-w-[75px] py-3 text-center font-bold text-blue-600 border-b-2 border-blue-60
