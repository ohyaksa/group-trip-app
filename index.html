<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단체 여행 매니저</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        #map-timeline, #map-expected, #map-actual { height: 320px; border-radius: 0.5rem; z-index: 10; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- 헤더 -->
    <header class="bg-blue-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <button type="button" onclick="goTripSelector()" id="btn-back" class="hidden bg-blue-700 active:bg-blue-900 px-3 py-1 rounded-lg text-xs font-bold cursor-pointer"><i class="fa-solid fa-arrow-left mr-1"></i> 목록</button>
                <h1 id="header-trip-title" class="text-base font-bold">여행 일정 목록</h1>
            </div>
            <span id="sync-status" class="text-xs bg-emerald-500 px-2.5 py-1 rounded-full text-white font-semibold">연결됨</span>
        </div>
    </header>

    <!-- 0. 여행 선택 화면 -->
    <div id="trip-selector-screen" class="max-w-4xl mx-auto px-4 py-6 w-full space-y-4">
        <div class="bg-white p-6 rounded-2xl shadow-sm border space-y-4">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <div>
                    <h2 class="text-lg font-bold text-slate-800">내 여행 일정 목록</h2>
                    <p class="text-xs text-slate-500 mt-0.5">아래 여행 항목을 터치하면 해당 일정으로 입장합니다.</p>
                </div>
                <button type="button" id="btn-create-danyang" class="w-full sm:w-auto bg-indigo-600 active:bg-indigo-800 text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow-sm cursor-pointer z-20">
                    <i class="fa-solid fa-wand-magic-sparkles mr-1"></i> 단양 여행 일정 생성
                </button>
            </div>
            <div id="trip-cards-container" class="space-y-2.5 pt-2"></div>
        </div>
    </div>

    <!-- 메인 앱 화면 -->
    <main id="main-app-screen" class="max-w-4xl mx-auto px-3 py-4 flex-grow w-full space-y-4 hidden">
        <div class="flex border-b border-slate-200 bg-white rounded-t-xl shadow-sm overflow-x-auto no-scrollbar text-xs md:text-sm sticky top-[60px] z-40">
            <button type="button" onclick="switchTab('timeline')" id="btn-tab-timeline" class="flex-1 min-w-[75px] py-3 text-center font-bold text-blue-600 border-b-2 border-blue-600 bg-blue-50/50 cursor-pointer">타임라인</button>
            <button type="button" onclick="switchTab('expected')" id="btn-tab-expected" class="flex-1 min-w-[75px] py-3 text-center font-semibold text-slate-500 cursor-pointer">예상일정</button>
            <button type="button" onclick="switchTab('actual')" id="btn-tab-actual" class="flex-1 min-w-[75px] py-3 text-center font-semibold text-slate-500 cursor-pointer">가계부</button>
        </div>

        <!-- 1. 타임라인 -->
        <section id="tab-timeline" class="space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border space-y-2">
                <div class="flex justify-between items-center text-xs">
                    <h3 class="font-bold text-slate-700"><i class="fa-solid fa-map text-blue-600 mr-1"></i> 지도상 동선 및 이동거리 확인 (선 클릭 시 팝업)</h3>
                    <div class="flex gap-2 text-[10px] flex-wrap">
                        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-blue-600"></span> 1일차 오전</span>
                        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-purple-600"></span> 1일차 오후</span>
                        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-600"></span> 2일차 오전</span>
                        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-amber-600"></span> 2일차 오후</span>
                    </div>
                </div>
                <div id="map-timeline"></div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border">
                <h3 class="font-bold text-blue-600 mb-3 text-sm">예상 일정 타임라인</h3>
                <div id="expected-timeline-list" class="space-y-2"></div>
            </div>
        </section>

        <!-- 2. 예상일정 관리 (추가/수정) -->
        <section id="tab-expected" class="space-y-4 hidden">
            <div class="bg-white p-5 rounded-xl shadow-sm border space-y-3">
                <h3 id="exp-form-title" class="font-bold text-slate-700 text-sm">예상 방문지 추가</h3>
                <div id="map-expected"></div>
                <form id="expected-form" class="grid grid-cols-1 gap-3">
                    <input type="hidden" id="exp-edit-id">
                    <input type="text" id="exp-place-name" placeholder="장소명" required class="border rounded-lg px-3 py-2 text-sm">
                    <input type="number" id="exp-budget" placeholder="예산 (원)" required class="border rounded-lg px-3 py-2 text-sm">
                    <div class="grid grid-cols-3 gap-2">
                        <input type="number" id="exp-day" placeholder="일차 (1 또는 2)" value="1" required class="border rounded-lg px-3 py-2 text-sm">
                        <input type="text" id="exp-time" placeholder="시간 (예: 10:55)" class="border rounded-lg px-3 py-2 text-sm">
                        <input type="number" id="exp-order" placeholder="순서 (1,2,3)" value="1" required class="border rounded-lg px-3 py-2 text-sm">
                    </div>
                    <input type="text" id="exp-memo" placeholder="메모" class="border rounded-lg px-3 py-2 text-sm">
                    <div class="flex gap-2">
                        <input type="text" id="exp-lat" placeholder="위도" required class="w-1/2 border rounded-lg px-3 py-2 text-xs bg-slate-50">
                        <input type="text" id="exp-lng" placeholder="경도" required class="w-1/2 border rounded-lg px-3 py-2 text-xs bg-slate-50">
                    </div>
                    <div class="flex gap-2">
                        <button type="submit" id="exp-submit-btn" class="flex-1 bg-blue-600 active:bg-blue-800 text-white py-2 rounded-lg text-sm font-bold cursor-pointer">일정 저장</button>
                        <button type="button" onclick="resetExpForm()" id="exp-cancel-btn" class="hidden bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium">취소</button>
                    </div>
                </form>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border">
                <h3 class="font-bold text-slate-700 mb-3 text-sm">예상 일정 목록 (수정/삭제 가능)</h3>
                <div id="expected-list" class="space-y-2"></div>
            </div>
        </section>

        <!-- 3. 가계부 (추가/수정) -->
        <section id="tab-actual" class="space-y-4 hidden">
            <div class="bg-white p-5 rounded-xl shadow-sm border space-y-3">
                <h3 id="act-form-title" class="font-bold text-slate-700 text-sm">실제 지출 입력</h3>
                <div id="map-actual"></div>
                <form id="actual-form" class="grid grid-cols-1 gap-3">
                    <input type="hidden" id="act-edit-id">
                    <input type="text" id="act-place" placeholder="장소명" required class="border rounded-lg px-3 py-2 text-sm">
                    <input type="text" id="act-traveler" placeholder="지출자" required class="border rounded-lg px-3 py-2 text-sm">
                    <input type="number" id="act-expense" placeholder="지출금액 (원)" required class="border rounded-lg px-3 py-2 text-sm">
                    <textarea id="act-action" placeholder="지출 내역" rows="2" required class="border rounded-lg px-3 py-2 text-sm"></textarea>
                    <div class="flex gap-2">
                        <input type="text" id="act-lat" placeholder="위도" class="w-1/2 border rounded-lg px-3 py-2 text-xs bg-slate-50">
                        <input type="text" id="act-lng" placeholder="경도" class="w-1/2 border rounded-lg px-3 py-2 text-xs bg-slate-50">
                    </div>
                    <div class="flex gap-2">
                        <button type="submit" id="act-submit-btn" class="flex-1 bg-emerald-600 active:bg-emerald-800 text-white py-2.5 rounded-lg text-sm font-bold cursor-pointer">지출 저장</button>
                        <button type="button" onclick="resetActForm()" id="act-cancel-btn" class="hidden bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium">취소</button>
                    </div>
                </form>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border">
                <h3 class="font-bold text-slate-700 mb-3 text-sm">실제 지출 목록 (수정/삭제 가능)</h3>
                <div id="actual-list" class="space-y-2.5"></div>
            </div>
        </section>
    </main>

    <!-- 스크립트 로직 -->
    <script>
        let currentTripId = null;
        let mapTl, mapExp, mapAct;
        let expMarker, actMarker;
        let tlLayers = [];
        let expectedData = [], actualData = [];

        function goTripSelector() {
            currentTripId = null;
            document.getElementById('trip-selector-screen').classList.remove('hidden');
            document.getElementById('main-app-screen').classList.add('hidden');
            document.getElementById('btn-back').classList.add('hidden');
            document.getElementById('header-trip-title').innerText = "여행 일정 목록";
            if (mapTl) setTimeout(() => mapTl.invalidateSize(), 200);
        }

        function selectTrip(tripId, tripName) {
            currentTripId = tripId;
            document.getElementById('trip-selector-screen').classList.add('hidden');
            document.getElementById('main-app-screen').classList.remove('hidden');
            document.getElementById('btn-back').classList.remove('hidden');
            document.getElementById('header-trip-title').innerText = tripName;
            switchTab('timeline');
            if (window.subscribeTripData) window.subscribeTripData(tripId);
        }

        function switchTab(tabId) {
            ['timeline', 'expected', 'actual'].forEach(id => {
                document.getElementById(`tab-${id}`).classList.add('hidden');
                document.getElementById(`btn-tab-${id}`).className = "flex-1 min-w-[75px] py-3 text-center font-semibold text-slate-500 cursor-pointer";
            });
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.getElementById(`btn-tab-${tabId}`).className = "flex-1 min-w-[75px] py-3 text-center font-bold text-blue-600 border-b-2 border-blue-600 bg-blue-50/50 cursor-pointer";
            
            setTimeout(() => {
                if (tabId === 'timeline' && mapTl) { mapTl.invalidateSize(); renderTimelineMap(); }
                if (tabId === 'expected' && mapExp) mapExp.invalidateSize();
                if (tabId === 'actual' && mapAct) mapAct.invalidateSize();
            }, 200);
        }

        function renderTimelines() {
            let expHtml = '';
            expectedData.forEach(item => {
                expHtml += `
                <div class="p-3 bg-slate-50 border rounded-lg flex justify-between items-center text-xs">
                    <div>
                        <b>[${item.day || 1}일차] ${item.place_name}</b> (${item.time || ''})
                        <p class="text-slate-500">예산: ${Number(item.budget || 0).toLocaleString()}원</p>
                    </div>
                    <div class="flex gap-2">
                        <button type="button" onclick="editExp('${item.id}')" class="text-blue-600 px-2 py-1 cursor-pointer">수정</button>
                        <button type="button" onclick="deleteSubItem('expected_places', '${item.id}')" class="text-red-500 px-2 py-1 cursor-pointer">삭제</button>
                    </div>
                </div>`;
            });
            document.getElementById('expected-timeline-list').innerHTML = expHtml || '<p class="text-xs text-slate-400">예상 일정이 없습니다.</p>';
            document.getElementById('expected-list').innerHTML = expHtml;

            let actHtml = '';
            actualData.forEach(item => {
                actHtml += `
                <div class="p-3 bg-emerald-50/30 border rounded-lg flex justify-between items-center text-xs">
                    <div>
                        <b>${item.place}</b> (${item.traveler}) - ${Number(item.expense || 0).toLocaleString()}원
                        <p class="text-slate-500">${item.action || ''}</p>
                    </div>
                    <div class="flex gap-2">
                        <button type="button" onclick="editAct('${item.id}')" class="text-blue-600 px-2 py-1 cursor-pointer">수정</button>
                        <button type="button" onclick="deleteSubItem('actual_visits', '${item.id}')" class="text-red-500 px-2 py-1 cursor-pointer">삭제</button>
                    </div>
                </div>`;
            });
            document.getElementById('actual-list').innerHTML = actHtml || '<p class="text-xs text-slate-400">지출 기록이 없습니다.</p>';
        }

        // 예상 일정 수정 모드 진입
        window.editExp = function(id) {
            const item = expectedData.find(x => x.id === id);
            if (!item) return;
            document.getElementById('exp-edit-id').value = item.id;
            document.getElementById('exp-place-name').value = item.place_name || '';
            document.getElementById('exp-budget').value = item.budget || 0;
            document.getElementById('exp-day').value = item.day || 1;
            document.getElementById('exp-time').value = item.time || '';
            document.getElementById('exp-order').value = item.sequence_order || 1;
            document.getElementById('exp-memo').value = item.memo || '';
            document.getElementById('exp-lat').value = item.lat || '';
            document.getElementById('exp-lng').value = item.lng || '';
            document.getElementById('exp-form-title').innerText = "예상 방문지 수정";
            document.getElementById('exp-submit-btn').innerText = "수정 완료";
            document.getElementById('exp-cancel-btn').classList.remove('hidden');
            switchTab('expected');
        };

        window.resetExpForm = function() {
            document.getElementById('expected-form').reset();
            document.getElementById('exp-edit-id').value = '';
            document.getElementById('exp-form-title').innerText = "예상 방문지 추가";
            document.getElementById('exp-submit-btn').innerText = "일정 저장";
            document.getElementById('exp-cancel-btn').classList.add('hidden');
        };

        // 가계부 지출 수정 모드 진입
        window.editAct = function(id) {
            const item = actualData.find(x => x.id === id);
            if (!item) return;
            document.getElementById('act-edit-id').value = item.id;
            document.getElementById('act-place').value = item.place || '';
            document.getElementById('act-traveler').value = item.traveler || '';
            document.getElementById('act-expense').value = item.expense || 0;
            document.getElementById('act-action').value = item.action || '';
            document.getElementById('act-lat').value = item.lat || '';
            document.getElementById('act-lng').value = item.lng || '';
            document.getElementById('act-form-title').innerText = "실제 지출 수정";
            document.getElementById('act-submit-btn').innerText = "수정 완료";
            document.getElementById('act-cancel-btn').classList.remove('hidden');
            switchTab('actual');
        };

        window.resetActForm = function() {
            document.getElementById('actual-form').reset();
            document.getElementById('act-edit-id').value = '';
            document.getElementById('act-form-title').innerText = "실제 지출 입력";
            document.getElementById('act-submit-btn').innerText = "지출 저장";
            document.getElementById('act-cancel-btn').classList.add('hidden');
        };

        // 거리 계산 (하버사인 공식, km)
        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * (Math.PI/180);
            const dLon = (lon2 - lon1) * (Math.PI/180);
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * (Math.PI/180)) * Math.cos(lat2 * (Math.PI/180)) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        // 일자별 및 오전/오후별 라인 색상 지정
        function getSegmentStyle(day, timeStr) {
            let hour = 12;
            if (timeStr) {
                const match = timeStr.match(/(\d{1,2}):/);
                if (match) hour = parseInt(match[1], 10);
            }
            const isPM = hour >= 12;
            if (String(day) === '1') {
                return isPM ? { color: '#9333ea', weight: 5, opacity: 0.85 } : { color: '#2563eb', weight: 5, opacity: 0.85 };
            } else {
                return isPM ? { color: '#d97706', weight: 5, opacity: 0.85 } : { color: '#059669', weight: 5, opacity: 0.85 };
            }
        }

        function renderTimelineMap() {
            if (!mapTl) return;
            tlLayers.forEach(l => mapTl.removeLayer(l));
            tlLayers = [];
            const bounds = [];

            let sortedExp = [...expectedData].sort((a, b) => (Number(a.day || 1) - Number(b.day || 1)) || (Number(a.sequence_order || 99) - Number(b.sequence_order || 99)));

            sortedExp.forEach(item => {
                if (item.lat && item.lng) {
                    const m = L.circleMarker([item.lat, item.lng], { radius: 7, fillColor: "#2563eb", color: "#fff", weight: 2, fillOpacity: 0.9 }).addTo(mapTl).bindPopup(`<b>[${item.day || 1}일차] ${item.place_name}</b><br>${item.time || ''}`);
                    tlLayers.push(m);
                    bounds.push([item.lat, item.lng]);
                }
            });

            for (let i = 0; i < sortedExp.length - 1; i++) {
                let p1 = sortedExp[i];
                let p2 = sortedExp[i+1];
                if (p1.lat && p1.lng && p2.lat && p2.lng) {
                    const distKm = getDistanceFromLatLonInKm(p1.lat, p1.lng, p2.lat, p2.lng);
                    const estMinutes = Math.round((distKm / 50) * 60 + 5);
                    const style = getSegmentStyle(p1.day, p1.time);

                    const polyline = L.polyline([[p1.lat, p1.lng], [p2.lat, p2.lng]], style).addTo(mapTl);
                    polyline.bindPopup(`🚗 <b>이동 구간 정보</b><br>${p1.place_name} ➔ ${p2.place_name}<br>📏 직선 거리: 약 ${distKm.toFixed(1)} km<br>⏱️ 예상 소요시간: 약 ${estMinutes}분`);
                    tlLayers.push(polyline);
                }
            }

            if (bounds.length > 0) mapTl.fitBounds(bounds, { padding: [30, 30] });
        }

        window.addEventListener('DOMContentLoaded', () => {
            const center = [36.9997, 128.3435];
            mapTl = L.map('map-timeline').setView(center, 10);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapTl);

            mapExp = L.map('map-expected').setView(center, 10);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapExp);
            mapExp.on('click', (e) => {
                document.getElementById('exp-lat').value = e.latlng.lat.toFixed(6);
                document.getElementById('exp-lng').value = e.latlng.lng.toFixed(6);
                if (expMarker) mapExp.removeLayer(expMarker);
                expMarker = L.marker([e.latlng.lat, e.latlng.lng]).addTo(mapExp);
            });

            mapAct = L.map('map-actual').setView(center, 10);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapAct);
            mapAct.on('click', (e) => {
                document.getElementById('act-lat').value = e.latlng.lat.toFixed(6);
                document.getElementById('act-lng').value = e.latlng.lng.toFixed(6);
                if (actMarker) mapAct.removeLayer(actMarker);
                actMarker = L.marker([e.latlng.lat, e.latlng.lng]).addTo(mapAct);
            });
        });
    </script>

    <!-- Firebase 통신 모듈 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBVXAi7WTQJ0sm7FXOjWwAMzmnvw1wSt0M",
            authDomain: "group-trip-app-754ca.firebaseapp.com",
            projectId: "group-trip-app-754ca",
            storageBucket: "group-trip-app-754ca.firebasestorage.app",
            messagingSenderId: "686842634804",
            appId: "1:686842634804:web:52b428c33b50167c312061",
            measurementId: "G-QP2ZYPK8MG"
        };

        let unsubscribeExp = null, unsubscribeAct = null;

        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            window.db = db;

            onSnapshot(query(collection(db, "trips")), (snapshot) => {
                let cardsHtml = '';
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    cardsHtml += `
                    <div class="trip-card bg-slate-50 active:bg-blue-100 border border-slate-200 p-4 rounded-xl flex justify-between items-center shadow-sm cursor-pointer transition" data-id="${docSnap.id}" data-name="${data.name || '여행'}">
                        <div class="pointer-events-none">
                            <h3 class="font-bold text-slate-800 text-sm">${data.name}</h3>
                            <p class="text-xs text-slate-500">${data.startDate || ''} ~ ${data.endDate || ''}</p>
                        </div>
                        <span class="text-xs bg-blue-600 text-white px-3 py-1.5 rounded-lg font-bold pointer-events-none">입장하기</span>
                    </div>`;
                });
                document.getElementById('trip-cards-container').innerHTML = cardsHtml || '<p class="text-xs text-slate-400">등록된 여행이 없습니다.</p>';
                
                document.querySelectorAll('.trip-card').forEach(card => {
                    card.onclick = function() {
                        const tripId = this.getAttribute('data-id');
                        const tripName = this.getAttribute('data-name');
                        selectTrip(tripId, tripName);
                    };
                });
            });

            document.getElementById('btn-create-danyang').onclick = async function() {
                try {
                    const tripRef = await addDoc(collection(db, "trips"), { name: "단양·영월·청풍호 1박 2일", startDate: "2026-10-23", endDate: "2026-10-24" });
                    const tripId = tripRef.id;

                    const initialPlaces = [
                        { day: 1, sequence_order: 1, time: "08:30", category: "출발", place_name: "용인 죽전 출발", budget: 150000, lat: 37.3248, lng: 127.1077, memo: "교통비" },
                        { day: 1, sequence_order: 2, time: "09:55", category: "휴게소", place_name: "천등산휴게소", budget: 0, lat: 37.0785, lng: 127.9123, memo: "간식" },
                        { day: 1, sequence_order: 3, time: "10:55", category: "관광", place_name: "도담삼봉", budget: 4500, lat: 36.9997, lng: 128.3435, memo: "주차" },
                        { day: 1, sequence_order: 4, time: "11:45", category: "식당", place_name: "단양구경시장·돌집식당", budget: 201000, lat: 36.9822, lng: 128.3688, memo: "점심" },
                        { day: 1, sequence_order: 5, time: "13:05", category: "관광", place_name: "만천하스카이워크", budget: 24000, lat: 36.9708, lng: 128.3389, memo: "입장" },
                        { day: 1, sequence_order: 6, time: "15:25", category: "카페", place_name: "카페 산", budget: 56000, lat: 37.0094, lng: 128.3995, memo: "음료" },
                        { day: 1, sequence_order: 7, time: "16:40", category: "장보기", place_name: "하나로마트 가곡점", budget: 185800, lat: 37.0315, lng: 128.3965, memo: "바비큐" },
                        { day: 1, sequence_order: 8, time: "17:55", category: "숙소", place_name: "더릴지즈 in 캠블리", budget: 256468, lat: 37.1835, lng: 128.4618, memo: "숙박" },
                        { day: 2, sequence_order: 9, time: "11:10", category: "관광", place_name: "옥순봉 출렁다리", budget: 24000, lat: 36.9427, lng: 128.2036, memo: "입장" },
                        { day: 2, sequence_order: 10, time: "12:40", category: "식당", place_name: "느티나무횟집", budget: 200000, lat: 37.0016, lng: 128.1742, memo: "송어회" },
                        { day: 2, sequence_order: 11, time: "13:50", category: "관광", place_name: "청풍호반케이블카", budget: 144000, lat: 37.0039, lng: 128.1755, memo: "케이블카" },
                        { day: 2, sequence_order: 12, time: "15:50", category: "카페", place_name: "콘크리트월", budget: 56000, lat: 37.0583, lng: 128.1585, memo: "커피" }
                    ];

                    for (const p of initialPlaces) {
                        await addDoc(collection(db, "trips", tripId, "expected_places"), p);
                    }
                    selectTrip(tripId, "단양·영월·청풍호 1박 2일");
                } catch (e) {
                    alert('생성 실패: ' + e.message);
                }
            };

            window.subscribeTripData = function(tripId) {
                if (unsubscribeExp) unsubscribeExp();
                if (unsubscribeAct) unsubscribeAct();

                unsubscribeExp = onSnapshot(query(collection(db, "trips", tripId, "expected_places")), (snapshot) => {
                    expectedData = [];
                    snapshot.forEach((docSnap) => expectedData.push({ id: docSnap.id, ...docSnap.data() }));
                    renderTimelines();
                    renderTimelineMap();
                });

                unsubscribeAct = onSnapshot(query(collection(db, "trips", tripId, "actual_visits")), (snapshot) => {
                    actualData = [];
                    snapshot.forEach((docSnap) => actualData.push({ id: docSnap.id, ...docSnap.data() }));
                    renderTimelines();
                });
            };

            // 예상 일정 추가 및 수정 처리
            document.getElementById('expected-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!currentTripId) return;
                const editId = document.getElementById('exp-edit-id').value;
                const payload = {
                    place_name: document.getElementById('exp-place-name').value,
                    budget: Number(document.getElementById('exp-budget').value),
                    day: Number(document.getElementById('exp-day').value),
                    time: document.getElementById('exp-time').value,
                    sequence_order: Number(document.getElementById('exp-order').value),
                    memo: document.getElementById('exp-memo').value,
                    lat: Number(document.getElementById('exp-lat').value),
                    lng: Number(document.getElementById('exp-lng').value)
                };
                if (editId) {
                    await updateDoc(doc(db, "trips", currentTripId, "expected_places", editId), payload);
                } else {
                    await addDoc(collection(db, "trips", currentTripId, "expected_places"), payload);
                }
                resetExpForm();
            });

            // 가계부 실제 지출 추가 및 수정 처리
            document.getElementById('actual-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!currentTripId) return;
                const editId = document.getElementById('act-edit-id').value;
                const payload = {
                    place: document.getElementById('act-place').value,
                    traveler: document.getElementById('act-traveler').value,
                    expense: Number(document.getElementById('act-expense').value),
                    action: document.getElementById('act-action').value,
                    lat: Number(document.getElementById('act-lat').value),
                    lng: Number(document.getElementById('act-lng').value)
                };
                if (editId) {
                    await updateDoc(doc(db, "trips", currentTripId, "actual_visits", editId), payload);
                } else {
                    await addDoc(collection(db, "trips", currentTripId, "actual_visits"), payload);
                }
                resetActForm();
            });

            window.deleteSubItem = async function(subCol, id) {
                if (confirm('삭제하시겠습니까?') && currentTripId) {
                    await deleteDoc(doc(db, "trips", currentTripId, subCol, id));
                }
            };

        } catch (e) {
            console.error(e);
        }
    </script>
</body>
</html>
