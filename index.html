<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 단체 여행 매니저</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        #map-timeline, #map-expected, #map-actual { height: 300px; border-radius: 0.75rem; z-index: 10; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <!-- 전역 에러 감지기 (자바스크립트 문법/런타임 에러 발생 시 즉시 화면에 표시) -->
    <script>
        window.addEventListener('error', function(e) {
            const box = document.getElementById('diagnostic-panel');
            const log = document.getElementById('diagnostic-log');
            if (box && log) {
                box.classList.remove('hidden');
                log.innerHTML += `<div class="text-red-300 mt-1">❌ [스크립트 오류] ${e.message} (줄: ${e.lineno})</div>`;
            }
        });
        window.addEventListener('unhandledrejection', function(e) {
            const box = document.getElementById('diagnostic-panel');
            const log = document.getElementById('diagnostic-log');
            if (box && log) {
                box.classList.remove('hidden');
                log.innerHTML += `<div class="text-red-300 mt-1">❌ [통신 거부 오류] ${e.reason ? (e.reason.message || e.reason) : '알 수 없는 이유'}</div>`;
            }
        });
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col pb-12">

    <!-- 상단 고정 헤더 -->
    <header class="bg-blue-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <button type="button" onclick="goTripSelector()" id="btn-back" class="hidden bg-blue-700 active:bg-blue-900 px-3 py-1.5 rounded-lg text-xs font-bold cursor-pointer transition flex items-center gap-1 shadow-sm">
                    <i class="fa-solid fa-arrow-left"></i> 목록
                </button>
                <div>
                    <h1 id="header-trip-title" class="text-base font-bold leading-tight">여행 일정 목록</h1>
                    <p id="header-trip-dates" class="text-[11px] text-blue-100 hidden"></p>
                </div>
            </div>
            <div class="flex items-center gap-1.5">
                <button type="button" onclick="toggleDiagnosticPanel()" class="bg-blue-700 hover:bg-blue-800 px-2.5 py-1 rounded-full text-[11px] font-semibold cursor-pointer">
                    <i class="fa-solid fa-stethoscope mr-0.5"></i>DB진단
                </button>
                <span id="sync-status" class="text-xs bg-amber-500 px-2.5 py-1 rounded-full text-white font-semibold shrink-0">연결중...</span>
            </div>
        </div>
    </header>

    <!-- ========================================== -->
    <!-- 실시간 DB 연결 상태 & 에러 원인 진단 패널      -->
    <!-- ========================================== -->
    <div id="diagnostic-panel" class="bg-slate-900 text-slate-100 px-4 py-3 text-xs border-b border-slate-700">
        <div class="max-w-4xl mx-auto space-y-2">
            <div class="flex justify-between items-center">
                <span class="font-bold text-amber-400 flex items-center gap-1.5">
                    <i class="fa-solid fa-satellite-dish"></i> 실시간 DB 연결 상태 및 오류 진단기
                </span>
                <button type="button" onclick="document.getElementById('diagnostic-panel').classList.add('hidden')" class="text-slate-400 hover:text-white text-xs px-2 py-0.5 bg-slate-800 rounded">닫기 ✕</button>
            </div>
            <div id="diagnostic-log" class="bg-slate-950 p-3 rounded-lg font-mono text-[11px] space-y-1 text-slate-300 max-h-48 overflow-y-auto">
                <div>⏳ [1단계] 웹페이지 기본 화면 로드 완료. Firebase 모듈 불러오는 중...</div>
            </div>
            <div class="flex flex-wrap gap-2 pt-1">
                <button type="button" onclick="runManualDBTest()" class="bg-blue-600 active:bg-blue-800 text-white px-3 py-1.5 rounded-lg font-bold text-[11px] cursor-pointer">
                    🔄 연결 강제 재시도 및 원인 테스트
                </button>
                <button type="button" onclick="resetAndMigrateDB()" class="bg-rose-600 active:bg-rose-800 text-white px-3 py-1.5 rounded-lg font-bold text-[11px] cursor-pointer">
                    🧹 꼬인 DB 초기화 후 단양 일정 새로 세팅하기
                </button>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 0. 첫 화면: 여행 목록 선택 및 생성/수정/삭제 -->
    <!-- ========================================== -->
    <div id="trip-selector-screen" class="max-w-4xl mx-auto px-4 py-5 w-full space-y-5">
        
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 pb-2 border-b border-slate-100">
                <div>
                    <h2 class="text-lg font-bold text-slate-800"><i class="fa-solid fa-suitcase-rolling text-blue-600 mr-1.5"></i>내 여행 일정 목록</h2>
                    <p class="text-xs text-slate-500 mt-0.5">입장할 여행을 선택하거나 수정·삭제할 수 있습니다.</p>
                </div>
                <button type="button" id="btn-create-danyang" class="w-full sm:w-auto bg-indigo-600 active:bg-indigo-800 text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow-sm cursor-pointer transition flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> 단양·청풍호 기본일정 자동생성
                </button>
            </div>
            <div id="trip-cards-container" class="space-y-3">
                <p class="text-xs text-slate-400 py-4 text-center">데이터베이스에서 여행 목록을 가져오는 중입니다...</p>
            </div>
        </div>

        <!-- 새 여행 만들기 / 기존 여행 제목·날짜 수정 폼 -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
            <h2 id="trip-form-title" class="text-base font-bold text-slate-800 flex items-center gap-1.5">
                <i class="fa-solid fa-circle-plus text-emerald-600"></i> 새로운 여행 직접 만들기
            </h2>
            <form id="trip-form" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <input type="hidden" id="trip-edit-id">
                <div class="sm:col-span-3">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">여행 제목</label>
                    <input type="text" id="trip-name" placeholder="예: 속초 가족 여행, 제주도 2박 3일" required class="w-full border border-slate-300 rounded-xl px-3.5 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">시작일</label>
                    <input type="date" id="trip-start" required class="w-full border border-slate-300 rounded-xl px-3.5 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">종료일</label>
                    <input type="date" id="trip-end" required class="w-full border border-slate-300 rounded-xl px-3.5 py-2 text-sm">
                </div>
                <div class="flex items-end gap-2">
                    <button type="submit" id="trip-submit-btn" class="w-full bg-blue-600 active:bg-blue-800 text-white py-2.5 rounded-xl font-bold text-sm cursor-pointer transition">
                        새 여행 저장
                    </button>
                    <button type="button" onclick="resetTripForm()" id="trip-cancel-btn" class="hidden w-full bg-slate-200 text-slate-700 py-2.5 rounded-xl font-bold
